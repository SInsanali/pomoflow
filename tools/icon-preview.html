<!doctype html>
<meta charset="utf-8">
<title>icon preview</title>
<!--
  Proof sheet for the drawn toolbar icon (src/background/icon.js): every case
  that has to stay legible, magnified, on both a light and a dark toolbar.

  ES modules will not load over file://, so serve the repo root:
      python3 -m http.server 8731
      open http://localhost:8731/tools/icon-preview.html
-->

<style>
  body { font: 13px system-ui; margin: 0; }
  .strip { display: flex; gap: 18px; padding: 18px 20px; align-items: flex-end; }
  .light { background: #f1f3f4; color: #202124; }
  .dark  { background: #292a2d; color: #e8eaed; }
  figure { margin: 0; text-align: center; }
  canvas { image-rendering: pixelated; display: block; }
  /* Marks the canvas edge, so a glyph running past it is obvious. */
  .strip canvas { outline: 1px solid rgba(140, 140, 140, 0.55); }
  figcaption { margin-top: 6px; font-size: 11px; opacity: .7; }
  h3 { margin: 0; padding: 14px 20px 0; font: 600 12px system-ui; letter-spacing: .04em; text-transform: uppercase; }
  /* Chrome's toolbar geometry: a 28px hit target holding a 16px icon. */
  .toolbar { display: flex; align-items: center; gap: 2px; padding: 14px 20px 18px; }
  .action { width: 16px; height: 16px; padding: 6px; box-sizing: content-box; display: block; }
  .disc { border-radius: 50%; }
</style>
<div class="dark">
  <h3>actual size, beside a neighbour icon</h3>
  <div class="toolbar" id="mock-dark"></div>
</div>
<div class="light">
  <h3>actual size, beside a neighbour icon</h3>
  <div class="toolbar" id="mock-light"></div>
</div>
<div class="light">
  <h3>light toolbar</h3>
  <div class="strip" id="light"></div>
</div>
<div class="dark">
  <h3>dark toolbar</h3>
  <div class="strip" id="dark"></div>
</div>
<script type="module">
  import { timerIcon } from '../src/background/icon.js';

  // ===== actual-size mock =====
  //
  // The magnified sheet below is for judging the pixels; this row is for
  // judging the thing that actually went wrong once — whether the number holds
  // its own against the disc-shaped icons either side of it in the toolbar.
  // Chrome gives each action a 28px button and draws the icon at 16 CSS px
  // (from the 32px bitmap on a 2x display).
  function mock(parent, cases) {
    const row = document.getElementById(parent);
    for (const [text, color] of cases) {
      const src = new OffscreenCanvas(32, 32);
      src.getContext('2d').putImageData(timerIcon(text, color)[32], 0, 0);

      const out = document.createElement('canvas');
      out.width = out.height = 32;
      out.style.width = out.style.height = '16px';
      out.getContext('2d').drawImage(src, 0, 0);
      out.className = 'action';
      row.append(out);
    }
    // Two filled discs stand in for the neighbours — same visual weight as the
    // real ones, and the point of comparison is size, not artwork.
    for (const fill of ['#d93025', '#1a73e8']) {
      const disc = document.createElement('span');
      disc.className = 'action disc';
      disc.style.background = fill;
      row.append(disc);
    }
  }

  // dusk pomodoro, mono pomodoro (pale — worst case on white), ocean break,
  // cyberpunk (vivid), and the sub-minute text.
  const cases = [
    ['25', '#e86a2c'], ['13', '#4a90d9'], ['5', '#e86a2c'],
    ['25', '#e0e0e0'], ['!', '#e86a2c'], ['10', '#29b6f6'], ['1', '#39ff14'],
  ];

  // Sam's report came from the dusk short break, blue on a dark toolbar.
  mock('mock-dark', [['16', '#4a90d9'], ['25', '#e86a2c'], ['5', '#e86a2c'], ['!', '#e86a2c']]);
  mock('mock-light', [['16', '#4a90d9'], ['25', '#e86a2c'], ['5', '#e86a2c'], ['!', '#e86a2c']]);

  for (const parent of ['light', 'dark']) {
    for (const [text, color] of cases) {
      for (const size of [16, 32]) {
        const data = timerIcon(text, color)[size];
        const src = new OffscreenCanvas(size, size);
        src.getContext('2d').putImageData(data, 0, 0);

        const out = document.createElement('canvas');
        out.width = out.height = 96;
        const ctx = out.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(src, 0, 0, 96, 96);

        const fig = document.createElement('figure');
        fig.append(out, Object.assign(document.createElement('figcaption'),
          { textContent: `${text} @${size} ${color}` }));
        document.getElementById(parent).append(fig);
      }
    }
  }
</script>
