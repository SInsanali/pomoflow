<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomoflow · Dashboard</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <header class="app-header">
        <nav class="app-nav" aria-label="Primary">
            <a href="/index.html">Timer</a>
            <a href="/dashboard.html" class="nav-active">Dashboard</a>
        </nav>
        <div class="app-header-actions">
            <button id="quit-btn" class="quit-btn" title="Stop Pomoflow">⏻ Quit</button>
        </div>
    </header>

    <main class="dash">
        <section class="tiles">
            <div class="tile">
                <span class="tile-value" id="t-today">–</span>
                <span class="tile-label">Today</span>
            </div>
            <div class="tile">
                <span class="tile-value" id="t-week">–</span>
                <span class="tile-label">This week</span>
            </div>
            <div class="tile">
                <span class="tile-value" id="t-blocks">–</span>
                <span class="tile-label">All-time blocks</span>
            </div>
        </section>

        <section class="card">
            <h2>Focus time · last 14 days</h2>
            <div id="trends" class="chart"></div>
        </section>

        <section class="card">
            <h2>Activity · last 17 weeks</h2>
            <div id="heatmap" class="chart"></div>
            <div class="heat-legend">
                <span>Less</span>
                <span class="heat-swatch lvl-0"></span>
                <span class="heat-swatch lvl-1"></span>
                <span class="heat-swatch lvl-2"></span>
                <span class="heat-swatch lvl-3"></span>
                <span class="heat-swatch lvl-4"></span>
                <span>More</span>
            </div>
        </section>

        <section class="card">
            <h2>Recent sessions</h2>
            <div class="table-wrap">
                <table id="log"></table>
            </div>
        </section>
    </main>

    <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
