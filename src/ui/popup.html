<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pomoflow</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/popup.css">
</head>
<body class="popup">
    <div class="popup-shell">
        <header class="popup-header">
            <span class="popup-mode" id="mode-label">Focus</span>
            <!-- The arrow-out-of-a-box glyph now carries "open the full page",
                 which is what it reads as. Popping out into a chromeless window
                 is the rarer move and lives one level in, at the bottom of the
                 quick settings (and in the full page's own header). -->
            <div class="popup-header-actions">
                <button id="open-app-btn" class="icon-btn" title="Dashboard &amp; full settings" aria-label="Open full page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h6v6" />
                        <path d="M10 14 21 3" />
                        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
                    </svg>
                </button>
                <button id="quick-settings-btn" class="icon-btn" title="Quick settings" aria-label="Quick settings"
                        aria-expanded="false" aria-controls="quick-settings">
                    <!-- Same gear as the full page's settings button, so the two
                         surfaces name the same idea with the same glyph. -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="mode-tabs" id="mode-tabs">
            <button class="mode-tab" data-mode="pomodoro">Pomodoro</button>
            <button class="mode-tab" data-mode="shortBreak">Short Break</button>
            <button class="mode-tab" data-mode="longBreak">Long Break</button>
        </div>

        <!-- The popup omits the flip clock deliberately: it needs more room
             than the ~800x600 popup cap comfortably allows. createSurface()
             falls back to the minimal readout for anyone whose saved style is
             flip, and the full page still honours it. -->
        <div class="timer-stage" id="timer-stage">
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-circular" id="timer-circular">
                <svg class="timer-ring" viewBox="0 0 100 100">
                    <circle class="ring-bg" cx="50" cy="50" r="45" />
                    <circle class="ring-progress" id="ring-progress" cx="50" cy="50" r="45"
                            stroke-dasharray="283" stroke-dashoffset="0" />
                </svg>
                <div class="timer-text" id="timer-text-circular">25:00</div>
            </div>
        </div>

        <div class="cycle-dots" id="cycle-dots" title="Pomodoros this cycle"></div>

        <div class="timer-controls">
            <button class="control-btn secondary" id="reset-btn" title="Reset">↺</button>
            <button class="control-btn primary" id="start-btn">Start</button>
            <button class="control-btn secondary" id="skip-btn" title="Skip">⏭</button>
        </div>

        <div class="popup-meta">
            <span id="session-counter">Study 1</span>
            <!-- The count is a *today* figure and resets itself at midnight;
                 this is the "start today over" escape hatch for the times it
                 needs to happen sooner. Session history is not touched. -->
            <span class="meta-count">
                <span id="goal-progress">0/4</span>
                <button id="count-reset-btn" class="meta-reset" title="Reset today's count"
                        aria-label="Reset today's count">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                </button>
            </span>
        </div>
    </div>

    <!-- ===== QUICK SETTINGS =====
         Deliberately a short list: the few things worth changing without
         leaving the timer. Everything else — volume, presets, clock style,
         export/import, and the chromeless pop-out window — lives in the full
         page, one click away via the header's open-in-new-tab button. -->
    <div class="quick-settings" id="quick-settings" hidden>
        <div class="qs-head">
            <span class="qs-title" id="qs-title">Quick settings</span>
            <!-- A house, not an ×: this does not dismiss anything, it takes you
                 back to the timer, which is the popup's home. With the theme
                 editor open it steps back one level instead, so a half-typed
                 theme is not thrown away by the only obvious way out. -->
            <button class="icon-btn qs-home" id="qs-close" title="Back to the timer"
                    aria-label="Back to the timer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5 12 3l9 7.5" />
                    <path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5" />
                </svg>
            </button>
        </div>

        <div class="qs-body">
            <section class="qs-block">
                <span class="qs-label">Appearance</span>
                <div class="qs-themes" id="qs-themes"></div>
                <div class="qs-row">
                    <span>Timer font</span>
                    <!-- Same eight stacks as the full page (FONT_STACKS), in the
                         same order, so the two surfaces never disagree about
                         what "Orbitron" means. -->
                    <select class="qs-select" id="qs-font">
                        <option value="system">System</option>
                        <option value="inter">Inter</option>
                        <option value="poppins">Poppins</option>
                        <option value="montserrat">Montserrat</option>
                        <option value="raleway">Raleway</option>
                        <option value="jetbrains">JetBrains Mono</option>
                        <option value="space">Space Mono</option>
                        <option value="orbitron">Orbitron</option>
                    </select>
                </div>
            </section>

            <!-- The custom-theme editor, back in the popup. Picking a theme
                 without leaving the timer only helps if *making* one does too;
                 the full page keeps its own copy for the wider layout.
                 While this is open the sheet hides every other block
                 (.quick-settings.editing), so the sheet stays one screen and
                 the tint behind it previews the colours being typed. -->
            <section class="qs-block qs-editor" id="qs-theme-editor" hidden>
                <input type="text" class="qs-text" id="qs-theme-name" maxlength="20"
                       placeholder="Theme name" autocomplete="off" spellcheck="false">

                <!-- Three tabs that are also the preview swatches: one set of
                     sliders edits whichever mode is selected, because three
                     stacked colour editors do not fit 340px. -->
                <div class="qs-mode-swatches" id="qs-mode-swatches" role="group"
                     aria-label="Which mode to colour">
                    <button class="qs-mode-swatch active" data-mode="pomodoro"
                            type="button" aria-pressed="true"><i></i>Focus</button>
                    <button class="qs-mode-swatch" data-mode="shortBreak"
                            type="button" aria-pressed="false"><i></i>Short</button>
                    <button class="qs-mode-swatch" data-mode="longBreak"
                            type="button" aria-pressed="false"><i></i>Long</button>
                </div>

                <!-- No <input type="color">: it opens the OS colour panel, and a
                     toolbar popup closes as soon as focus leaves it — the theme
                     being made would go with it. Each track is painted with what
                     it does, so the sliders need no labels. -->
                <div class="qs-sliders">
                    <input type="range" id="qs-hue" min="0" max="360" step="1" aria-label="Hue">
                    <input type="range" id="qs-sat" min="0" max="100" step="1" aria-label="Saturation">
                    <input type="range" id="qs-light" min="0" max="100" step="1" aria-label="Lightness">
                </div>

                <div class="qs-row">
                    <span id="qs-hex-label">Hex</span>
                    <input type="text" class="qs-hex" id="qs-hex" maxlength="7"
                           spellcheck="false" autocomplete="off" aria-labelledby="qs-hex-label">
                </div>

                <div class="qs-editor-actions">
                    <button class="qs-btn" id="qs-theme-cancel">Cancel</button>
                    <button class="qs-btn primary" id="qs-theme-save">Save</button>
                </div>
                <!-- Two-step, like the reset below: confirm() can take a
                     toolbar popup down with it. -->
                <button class="qs-reset" id="qs-theme-delete" hidden>Delete theme</button>
            </section>

            <section class="qs-block">
                <span class="qs-label">Minutes</span>
                <div class="qs-durations">
                    <label>
                        <input type="number" id="qs-pomodoro" min="1" max="60" step="1">
                        <span>Focus</span>
                    </label>
                    <label>
                        <input type="number" id="qs-short-break" min="1" max="30" step="1">
                        <span>Short</span>
                    </label>
                    <label>
                        <input type="number" id="qs-long-break" min="1" max="60" step="1">
                        <span>Long</span>
                    </label>
                </div>
            </section>

            <section class="qs-block">
                <div class="qs-row">
                    <span>Chime</span>
                    <span class="qs-inline">
                        <select class="qs-select" id="qs-sound">
                            <option value="chime">Chime</option>
                            <option value="digital">Digital</option>
                            <option value="gong">Gong</option>
                            <option value="melody">Melody</option>
                        </select>
                        <button class="qs-play" id="qs-play" title="Play" aria-label="Play the chime">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </button>
                    </span>
                </div>
                <!-- Picking a chime is pointless if it cannot be heard, and the
                     volume slider stays in the full page — so say so rather
                     than letting the preview fail silently. -->
                <p class="qs-note qs-muted" id="qs-muted" hidden>
                    Volume is at zero — raise it in full settings to hear this.
                </p>
                <div class="qs-row">
                    <span>Auto-start breaks</span>
                    <label class="toggle">
                        <input type="checkbox" id="qs-auto-breaks">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="qs-row">
                    <span>Auto-start pomodoros</span>
                    <label class="toggle">
                        <input type="checkbox" id="qs-auto-pomodoros">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="qs-row">
                    <span>Desktop notifications</span>
                    <label class="toggle">
                        <input type="checkbox" id="qs-notifications">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </section>
        </div>

        <div class="qs-foot">
            <!-- Two-step rather than a confirm(): a modal dialog inside a
                 toolbar popup can take the popup down with it. -->
            <button class="qs-reset" id="qs-reset">Reset settings</button>
            <p class="qs-note" id="qs-reset-note" hidden>
                Restores defaults and deletes custom themes. History is kept.
            </p>
        </div>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
